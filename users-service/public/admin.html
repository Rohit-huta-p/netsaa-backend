<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NETSA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141c;
    --border: #2a2a36;
    --text: #f5f5f7;
    --muted: #8a8a99;
    --accent: #ff6b35;
    --purple: #8b5cf6;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  main { padding: 24px 32px 80px; max-width: 1400px; margin: 0 auto; }
  .auth { display: flex; gap: 8px; align-items: center; }
  .auth input { width: 240px; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input, button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer;
    transition: background 0.15s;
    font-weight: 500;
  }
  button:hover { background: #1c1c26; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #e85a28; }
  button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: rgba(239,68,68,0.1); }
  .grid { display: grid; gap: 10px; }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .row:hover { border-color: #3a3a48; }
  .row .meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    background: #1c1c26;
    color: var(--muted);
    text-transform: uppercase;
  }
  .badge.active { background: rgba(34,197,94,0.15); color: var(--ok); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 18px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    max-width: 400px;
    font-size: 13px;
    z-index: 100;
    animation: slide 0.2s ease;
  }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--danger); }
  @keyframes slide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .stat { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; max-width: 480px; width: 90%;
  }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.5; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .report { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); margin-top: 8px; max-height: 120px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>NETSA <span>admin</span></h1>
  <div class="auth">
    <input id="token" type="password" placeholder="Admin token" />
    <button class="primary" onclick="saveToken()">Save</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="users" onclick="switchTab('users')">Users</button>
    <button class="tab" data-tab="gigs" onclick="switchTab('gigs')">Gigs</button>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search by name, email, phone, title..." style="flex:1; min-width:200px;" />
    <button onclick="load()">Search</button>
    <button onclick="document.getElementById('search').value=''; load()">Clear</button>
  </div>

  <div class="stat" id="stat"></div>
  <div class="grid" id="list"></div>
</main>

<script>
  let tab = 'users';
  let token = localStorage.getItem('netsa_admin_token') || '';
  document.getElementById('token').value = token;

  function saveToken() {
    token = document.getElementById('token').value.trim();
    localStorage.setItem('netsa_admin_token', token);
    toast('Token saved', 'ok');
    load();
  }

  function switchTab(t) {
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    document.getElementById('search').value = '';
    load();
  }

  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  async function api(path, opts) {
    const r = await fetch('/api/admin' + path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts && opts.headers || {}) },
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  async function load() {
    const list = document.getElementById('list');
    const stat = document.getElementById('stat');
    list.innerHTML = '';
    stat.textContent = 'Loading...';
    if (!token) { stat.textContent = 'Set admin token first.'; return; }
    const q = document.getElementById('search').value.trim();
    try {
      const data = await api('/' + tab + (q ? '?q=' + encodeURIComponent(q) : ''));
      stat.textContent = data.count + ' ' + tab + (data.count >= 200 ? ' (showing first 200)' : '');
      if (!data.count) { list.innerHTML = '<div class="empty">No ' + tab + ' found</div>'; return; }
      const items = data[tab];
      list.innerHTML = items.map(it => tab === 'users' ? userRow(it) : gigRow(it)).join('');
    } catch (e) {
      stat.textContent = '';
      list.innerHTML = '<div class="empty">' + e.message + '</div>';
    }
  }

  function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function userRow(u) {
    const status = u.accountStatus === 'active' ? '<span class="badge active">active</span>' : '<span class="badge">' + esc(u.accountStatus || 'unknown') + '</span>';
    return '<div class="row"><div>'
      + '<div class="name">' + esc(u.displayName || '(no name)') + ' ' + status + '</div>'
      + '<div class="meta">'
      + '<span>' + esc(u.email || '—') + '</span>'
      + '<span>' + esc(u.phone || '—') + '</span>'
      + '<span>joined ' + fmtDate(u.createdAt) + '</span>'
      + '<span class="id">' + u._id + '</span>'
      + '</div></div>'
      + '<button class="danger" onclick="confirmDel(\'users\', \'' + u._id + '\', \'' + esc(u.displayName || u.email || u._id) + '\')">Delete</button>'
      + '</div>';
  }

  function gigRow(g) {
    const org = (g.organizerSnapshot && g.organizerSnapshot.displayName) || '—';
    const city = (g.location && g.location.city) || '—';
    return '<div class="row"><div>'
      + '<div class="name">' + esc(g.title || '(no title)') + ' <span class="badge">' + esc(g.status || 'unknown') + '</span></div>'
      + '<div class="meta">'
      + '<span>by ' + esc(org) + '</span>'
      + '<span>' + esc(city) + '</span>'
      + '<span>posted ' + fmtDate(g.createdAt) + '</span>'
      + '<span class="id">' + g._id + '</span>'
      + '</div></div>'
      + '<button class="danger" onclick="confirmDel(\'gigs\', \'' + g._id + '\', \'' + esc(g.title || g._id) + '\')">Delete</button>'
      + '</div>';
  }

  function confirmDel(kind, id, label) {
    const noun = kind === 'users' ? 'user' : 'gig';
    const extra = kind === 'users'
      ? 'This will cascade delete the user and ALL related data: profile, connections, conversations, messages, notifications, events, gigs, applications, support tickets.'
      : 'This will cascade delete the gig and ALL related data: comments, applications, saves, stats.';
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" onclick="event.stopPropagation()">'
      + '<h3>Delete ' + noun + ': ' + label + '?</h3>'
      + '<p>' + extra + ' <strong style="color:#ef4444">This cannot be undone.</strong></p>'
      + '<div class="actions">'
      + '<button onclick="this.closest(\'.modal-bg\').remove()">Cancel</button>'
      + '<button class="danger" id="confirmBtn">Delete forever</button>'
      + '</div></div>';
    bg.onclick = () => bg.remove();
    document.body.appendChild(bg);
    bg.querySelector('#confirmBtn').onclick = async () => {
      bg.querySelector('#confirmBtn').disabled = true;
      bg.querySelector('#confirmBtn').textContent = 'Deleting...';
      try {
        const data = await api('/' + kind + '/' + id, { method: 'DELETE' });
        const total = Object.values(data.report).reduce((a,b) => a + b, 0);
        toast('Deleted ' + noun + ' (' + total + ' docs removed)', 'ok');
        bg.remove();
        load();
      } catch (e) {
        toast(e.message, 'err');
        bg.querySelector('#confirmBtn').disabled = false;
        bg.querySelector('#confirmBtn').textContent = 'Delete forever';
      }
    };
  }

  document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  if (token) load();
</script>
</body>
</html>

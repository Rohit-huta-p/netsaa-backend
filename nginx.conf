# Nginx reverse proxy — all 7 NETSA services on one VM
# Place at: /etc/nginx/sites-available/netsaa
# Enable:   ln -s /etc/nginx/sites-available/netsaa /etc/nginx/sites-enabled/
# Reload:   nginx -t && systemctl reload nginx

upstream users   { server 127.0.0.1:5001; }
upstream gigs    { server 127.0.0.1:5002; }
upstream events  { server 127.0.0.1:5003; }
upstream payment { server 127.0.0.1:5005; }
upstream media   { server 127.0.0.1:4005; }
upstream search  { server 127.0.0.1:3000; }
upstream support { server 127.0.0.1:5006; }

server {
    listen 80;
    server_name _;                    # replace with your domain e.g. api.netsaa.in
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;                    # replace with your domain

    ssl_certificate     /etc/ssl/netsaa/fullchain.pem;
    ssl_certificate_key /etc/ssl/netsaa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Shared proxy settings ──────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # ── users-service (:5001) ──────────────────────────────────
    # Regular HTTP routes
    location /api/users/ {
        proxy_pass http://users;
    }
    location /api/auth/ {
        proxy_pass http://users;
    }

    # Socket.IO — needs Upgrade header + sticky connection
    location /socket.io/ {
        proxy_pass http://users;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # keep WS alive
        proxy_send_timeout 3600s;
    }

    # ── gigs-service (:5002) ──────────────────────────────────
    location /api/gigs/ {
        proxy_pass http://gigs;
    }

    # ── events-service (:5003) ────────────────────────────────
    location /api/events/ {
        proxy_pass http://events;
    }

    # ── payment-service (:5005) ───────────────────────────────
    location /api/payment/ {
        proxy_pass http://payment;
    }
    # Razorpay webhook — raw body must reach the service unchanged
    location /api/payment/webhook {
        proxy_pass http://payment;
        proxy_set_header Content-Type $content_type;
    }

    # ── media-service (:4005) ─────────────────────────────────
    location /api/media/ {
        proxy_pass http://media;
        client_max_body_size 1M;    # presign only — no file bytes pass through
    }

    # ── search-service (:3000) ────────────────────────────────
    location /api/search/ {
        proxy_pass http://search;
    }

    # ── support-service (:5006) ───────────────────────────────
    location /api/support/ {
        proxy_pass http://support;
    }

    # ── health check ──────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
